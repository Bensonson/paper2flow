<svg xmlns="http://www.w3.org/2000/svg" width="580" height="328" viewBox="0 0 580 328" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">paper2flow 如何生成报告并回答问题</title>
  <desc id="desc">沿左列向下阅读，再向右进入双语报告。右列展示每个节点的问题和对话历史如何交给本机 Codex CLI，结合原始 PDF 作答并将答案返回报告。</desc>
  <defs>
